":\"$:/language/Docs/Fields/dependents\",\"text\":\"Listet die Abhängigkeiten bei \\\"plugins\\\" auf.\"},\"$:/language/Docs/Fields/description\":{\"title\":\"$:/language/Docs/Fields/description\",\"text\":\"Die Beschreibung für ein \\\"plugin\\\" oder einen \\\"modalen\\\" Dialog.\"},\"$:/language/Docs/Fields/draft.of\":{\"title\":\"$:/language/Docs/Fields/draft.of\",\"text\":\"Entwurf von - enthält den Titel des Tiddlers, zu dem dieser Entwurf-Tiddler gehört.\"},\"$:/language/Docs/Fields/draft.title\":{\"title\":\"$:/language/Docs/Fields/draft.title\",\"text\":\"Entwurf Titel - enthält den neuen Titel, wenn der Entwurf-Tiddler gespeichert wird.\"},\"$:/language/Docs/Fields/footer\":{\"title\":\"$:/language/Docs/Fields/footer\",\"text\":\"Der Fußnoten Text bei einem \\\"~Wizard-Dialog\\\"\"},\"$:/language/Docs/Fields/hide-body\":{\"title\":\"$:/language/Docs/Fields/hide-body\",\"text\":\"Der Textbereich eines Tiddlers wird verborgen, wenn dieses Feld auf ''\\\"yes\\\"'' gesetzt wird\"},\"$:/language/Docs/Fields/icon\":{\"title\":\"$:/language/Docs/Fields/icon\",\"text\":\"Der Titel eines ~Icon-Tiddlers, der mit diesem Tiddler verbunden ist.\"},\"$:/language/Docs/Fields/library\":{\"title\":\"$:/language/Docs/Fields/library\",\"text\":\"Wenn dieses Feld=\\\"yes\\\" ist, dann soll der Tiddler als JavaScript Bibliothek gespeichert werden.\"},\"$:/language/Docs/Fields/list\":{\"title\":\"$:/language/Docs/Fields/list\",\"text\":\"Eine geordnete Tiddler Liste, die mit diesem Tiddler verbunden ist.\"},\"$:/language/Docs/Fields/list-before\":{\"title\":\"$:/language/Docs/Fields/list-before\",\"text\":\"Dient zum Einfügen von Tiddler Titeln in das \\\"list\\\" Feld. Wenn gesetzt, wird der neue Tiddler ''vor'' dem hier definierten Tiddler in die Liste eingefügt. Wenn vorhanden, aber leer, dann wird der neue Tiddler an den Anfang der Liste gesetzt.\"},\"$:/language/Docs/Fields/list-after\":{\"title\":\"$:/language/Docs/Fields/list-after\",\"text\":\"Dient zum Einfügen von Tiddler Titeln in das \\\"list\\\" Feld. Wenn gesetzt, wird der neue Tiddler ''nach'' dem hier definierten Tiddler in die Liste eingefügt.\"},\"$:/language/Docs/Fields/modified\":{\"title\":\"$:/language/Docs/Fields/modified\",\"text\":\"Datum, an dem der Tiddler zuletzt verändert wurde.\"},\"$:/language/Docs/Fields/modifier\":{\"title\":\"$:/language/Docs/Fields/modifier\",\"text\":\"Name der Person, die den Tiddler zuletzt verändert hat.\"},\"$:/language/Docs/Fields/module-type\":{\"title\":\"$:/language/Docs/Fields/module-type\",\"text\":\"Zeigt den Modul-typ bei JavaScript Tiddlern an.\"},\"$:/language/Docs/Fields/name\":{\"title\":\"$:/language/Docs/Fields/name\",\"text\":\"Ein Menschen lesbarer Name für einen \\\"plugin\\\" Tiddler.\"},\"$:/language/Docs/Fields/parent-plugin\":{\"title\":\"$:/language/Docs/Fields/parent-plugin\",\"text\":\"Enthält den Namen des Übergeordneten Plugins.\"},\"$:/language/Docs/Fields/plugin-priority\":{\"title\":\"$:/language/Docs/Fields/plugin-priority\",\"text\":\"Ein numerischer Wert, der die Priorität eines \\\"plugins\\\" festlegt.\"},\"$:/language/Docs/Fields/plugin-type\":{\"title\":\"$:/language/Docs/Fields/plugin-type\",\"text\":\"Der Typ eines \\\"plugins\\\".\"},\"$:/language/Docs/Fields/revision\":{\"title\":\"$:/language/Docs/Fields/revision\",\"text\":\"Die Revisionsnummer eines Tiddlers. Wird von einem Server vergeben.\"},\"$:/language/Docs/Fields/released\":{\"title\":\"$:/language/Docs/Fields/released\",\"text\":\"Datum der ~TiddlyWiki Ausgabe.\"},\"$:/language/Docs/Fields/stability\":{\"title\":\"$:/language/Docs/Fields/stability\",\"text\":\"Entwicklungs Status: \\\"deprecated\\\"=abgekündigt, \\\"experimental\\\"=experimentell, \\\"stable\\\"=stabil, \\\"legacy\\\"=Altlast.\"},\"$:/language/Docs/Fields/source\":{\"title\":\"$:/language/Docs/Fields/source\",\"text\":\"Eine Quelltext URL, verbunden mit diesem Tiddler.\"},\"$:/language/Docs/Fields/subtitle\":{\"title\":\"$:/language/Docs/Fields/subtitle\",\"text\":\"Der Untertitel für einen \\\"~Wizard-Dialog\\\".\"},\"$:/language/Docs/Fields/tags\":{\"title\":\"$:/language/Docs/Fields/tags\",\"text\":\"Eine Liste von \\\"Tags\\\" für diesen Tiddler.\"},\"$:/language/Docs/Fields/text\":{\"title\":\"$:/language/Docs/Fields/text\",\"text\":\"Der Haupttext eines Tiddlers.\"},\"$:/language/Docs/Fields/throttle.refresh\":{\"title\":\"$:/language/Docs/Fields/throttle.refresh\",\"text\":\"Wenn es existiert, dann wird der \\\"refresh\\\" Zyklus des Tiddlers verzögert.\"},\"$:/language/Docs/Fields/title\":{\"title\":\"$:/language/Docs/Fields/title\",\"text\":\"Ein individueller einmaliger Name eines Tiddlers.\"},\"$:/language/Docs/Fields/toc-link\":{\"title\":\"$:/language/Docs/Fields/toc-link\",\"text\":\"Unterdrückt die Anzeige als Link, wenn der Wert auf ''\\\"no\\\"'' gesetzt wird\"},\"$:/language/Docs/Fields/type\":{\"title\":\"$:/language/Docs/Fields/type\",\"text\":\"Legt den Typ eines Tiddlers fest (aka MIME-type).\"},\"$:/language/Docs/Fields/version\":{\"title\":\"$:/language/Docs/Fields/version\",\"text\":\"Versions-Information eines \\\"plugins\\\".\"},\"$:/language/Docs/Fields/_is_skinny\":{\"title\":\"$:/language/Docs/Fields/_is_skinny\",\"text\":\"Wenn es existiert, zeigt diese Feld an, dass das \\\"Text-Feld\\\" dynamisch vom Server geladen wird.\"},\"$:/language/Filters/AllTiddlers\":{\"title\":\"$:/language/Filters/AllTiddlers\",\"text\":\"Alle Tiddler außer System-Tiddler\"},\"$:/language/Filters/RecentSystemTiddlers\":{\"title\":\"$:/language/Filters/RecentSystemTiddlers\",\"text\":\"Kürzlich veränderte Tiddler, inklusive System-Tiddler\"},\"$:/language/Filters/RecentTiddlers\":{\"title\":\"$:/language/Filters/RecentTiddlers\",\"text\":\"Kürzlich veränderte Tiddler\"},\"$:/language/Filters/AllTags\":{\"title\":\"$:/language/Filters/AllTags\",\"text\":\"Alle Tags außer System-Tags\"},\"$:/language/Filters/Missing\":{\"title\":\"$:/language/Filters/Missing\",\"text\":\"Fehlende Tiddler\"},\"$:/language/Filters/Drafts\":{\"title\":\"$:/language/Filters/Drafts\",\"text\":\"Entwurf Tiddler\"},\"$:/language/Filters/Orphans\":{\"title\":\"$:/language/Filters/Orphans\",\"text\":\"Waisen Tiddler\"},\"$:/language/Filters/SystemTiddlers\":{\"title\":\"$:/language/Filters/SystemTiddlers\",\"text\":\"System-Tiddler\"},\"$:/language/Filters/ShadowTiddlers\":{\"title\":\"$:/language/Filters/ShadowTiddlers\",\"text\":\"Schatten-Tiddler\"},\"$:/language/Filters/OverriddenShadowTiddlers\":{\"title\":\"$:/language/Filters/OverriddenShadowTiddlers\",\"text\":\"Überschriebene Schatten-Tiddler\"},\"$:/language/Filters/SessionTiddlers\":{\"title\":\"$:/language/Filters/SessionTiddlers\",\"text\":\"Tiddler, die seit dem letzten Laden verändert wurden\"},\"$:/language/Filters/SystemTags\":{\"title\":\"$:/language/Filters/SystemTags\",\"text\":\"System-Tags\"},\"$:/language/Filters/StoryList\":{\"title\":\"$:/language/Filters/StoryList\",\"text\":\"Tiddler im \\\"story river\\\", außer \u003c$text text=\\\"$:/AdvancedSearch\\\"/>\"},\"$:/language/Filters/TypedTiddlers\":{\"title\":\"$:/language/Filters/TypedTiddlers\",\"text\":\"Nicht \\\"wiki-text\\\" Tiddler\"},\"GettingStarted\":{\"title\":\"GettingStarted\",\"text\":\"\\\\define lingo-base() $:/language/ControlPanel/Basics/\\nWillkommen bei ~TiddlyWiki, einem persönlichen nicht-linearen Web-Notizbuch.\\n\\nVor dem Start, vergewissern Sie sich, dass Sie dieses Wiki auch wirklich speichern können. Weitere Informationen finden Sie für:\\n\\n* Österreich: https://tiddlywiki.com/languages/de-AT\\n* Deutschland: https://tiddlywiki.com/languages/de-DE\\n* Allgemein (englisch): https://tiddlywiki.com \\n\\nErste Schritte:\\n\\n* Erstellen Sie einen neuen Tiddler mit dem \\\"Plus-Button\\\" in der rechten Navigationsleiste.\\n* Einstellungen können im [[Kontrollpanel|$:/ControlPanel]] vorgenommen werden. Siehe: \\\"Zahnrad-Button\\\" \\n** Das Anzeigen dieses Tiddlers können Sie verhindern, indem Sie die \\\"~DefaultTiddlers\\\" im ''Basis-Tab'' verändern.\\n* Speichern wird mit dem \\\"Speichern-Button\\\" in der Navigationsleiste ausgelöst. \\n* Österreich: [[Weitere Informationen zu WikiText|https://tiddlywiki.com/languages/de-AT/index.html#WikiText]]\\n* Deutschland: [[Weitere Informationen zu WikiText|https://tiddlywiki.com/languages/de-DE/index.html#WikiText]]\\n\\nHinweis: Die österreichische und deutsche Version unterscheiden sich momentan nur in der Flagge, die bei der Standard Sprachauswahl angezeigt wird. In Zukunft können Beschriftungen der Benutzeroberfläche geringfügig von einander abweichen. zB: Jänner - Januar.\\n\\n!! Einrichten dieser ~TiddlyWiki\\n\\n\u003cdiv class=\\\"tc-control-panel\\\">\\n\\n|tc-table-no-border tc-first-col-min-width tc-first-link-nowrap|k\\n| \u003c$link to=\\\"$:/SiteTitle\\\">\u003c\u003clingo Title/Prompt>>\u003c/$link>|\u003c$edit-text tiddler=\\\"$:/SiteTitle\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n| \u003c$link to=\\\"$:/SiteSubtitle\\\">\u003c\u003clingo Subtitle/Prompt>>\u003c/$link>|\u003c$edit-text tiddler=\\\"$:/SiteSubtitle\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|^ \u003c$link to=\\\"$:/DefaultTiddlers\\\">\u003c\u003clingo DefaultTiddlers/Prompt>>\u003c/$link>\u003cbr>\u003c\u003clingo DefaultTiddlers/TopHint>>| \u003c$edit-text tag=\\\"textarea\\\" tiddler=\\\"$:/DefaultTiddlers\\\"/>\u003cbr>//\u003c\u003clingo DefaultTiddlers/BottomHint>>// |\\n\u003c/div>\\n\\nSee the [[control panel|$:/ControlPanel]] for more options.\\n\"},\"$:/language/Help/build\":{\"title\":\"$:/language/Help/build\",\"description\":\"Ausführen, von vorkonfigurierten Befehlen.\",\"text\":\"Dieser Befehl erstellt eine Zielversion, der aktuellen Wiki Edition. Sind keine Ziele spezifiziert, dann werden all konfigurierten Ziele erstellt.\\n\\n```\\n--build \u003ctarget> [\u003ctarget> ...]\\n```\\n\\nZiele werden in der `tiddlywiki.info` Datei, im Wiki Verzeichnis konfiguriert.\\n\"},\"$:/language/Help/clearpassword\":{\"title\":\"$:/language/Help/clearpassword\",\"description\":\"Lösche das Passwort, das für die vorhergehenden Verschlüsselungen verwendet wurde.\",\"text\":\"Lösche das Passwort, das für die vorhergehenden Verschlüsselungen verwendet wurde.\\n\\n```\\n--clearpassword\\n```\\n\"},\"$:/language/Help/commands\":{\"title\":\"$:/language/Help/commands\",\"description\":\"Ausführen von Befehlen aus einem Filter\",\"text\":\"Sequentielle Abarbeitung von Befehlen aus einem Filter.\\n\\n```\\n--commands \u003cfilter>\\n```\\n\\nBeispiele\\n\\n```\\n--commands \\\"[enlist:raw{$:/build-commands-as-text}]\\\"\\n```\\n\\n```\\n--commands \\\"[{$:/build-commands-as-json}jsonindexes[]] :map[{$:/build-commands-as-json}jsonget\u003ccurrentTiddler>]\\\"\\n```\"},\"$:/language/Help/default\":{\"title\":\"$:/language/Help/default\",\"text\":\"\\\\define commandTitle()\\n$:/language/Help/$(command)$\\n\\\\end\\n```\\nVerwendung: tiddlywiki [\u003cwikifolder>] [--\u003ccommand> [\u003cargs>...]...]\\n```\\n\\nVerfügbare Befehle:\\n\\n\u003cul>\\n\u003c$list filter=\\\"[commands[]sort[title]]\\\" variable=\\\"command\\\">\\n\u003cli>\u003c$link to=\u003c\u003ccommandTitle>>>\u003c$macrocall $name=\\\"command\\\" $type=\\\"text/plain\\\" $output=\\\"text/plain\\\"/>\u003c/$link>: \u003c$transclude tiddler=\u003c\u003ccommandTitle>> field=\\\"description\\\"/>\u003c/li>\\n\u003c/$list>\\n\u003c/ul>\\n\\nDetailierte Informationen zu den Befehlen:\\n\\n```\\ntiddlywiki --help \u003ccommand>\\n```\\n\"},\"$:/language/Help/deletetiddlers\":{\"title\":\"$:/language/Help/deletetiddlers\",\"description\":\"Löscht eine Gruppe von Tiddlern\",\"text\":\"\u003c\u003c.from-version \\\"5.1.20\\\">> Löscht eine Gruppe von Tiddlern, die über einen Filter definiert werden.\\n\\n```\\n--deletetiddlers \u003cfilter>\\n```\"},\"$:/language/Help/editions\":{\"title\":\"$:/language/Help/editions\",\"description\":\"Listet alle verfügbaren TiddlyWiki Editionen auf\",\"text\":\"Listet alle verfügbaren TiddlyWiki Editionen auf.\\n\\n```\\n--editions\\n```\\n\\nSie können ein neues Wiki mit dem `--init` Befehl erstellen. Dabei wird eine der angezeigten Editionen \\\"geklont\\\".\\n\"},\"$:/language/Help/fetch\":{\"title\":\"$:/language/Help/fetch\",\"description\":\"Laden mehrerer Tiddler über eine URL\",\"text\":\"Abrufen eines oder mehrerer Tiddler über HTTP/HTTPS. Importieren der tiddler, die dem Filter entsprechen. Umwandeln der ankommenden Titel, wenn nötig.\\n\\n```\\n--fetch file \u003curl> \u003cimport-filter> \u003ctransform-filter>\\n--fetch files \u003curl-filter> \u003cimport-filter> \u003ctransform-filter>\\n--fetch raw-file \u003curl> \u003ctransform-filter>\\n--fetch raw-files \u003curl-filter> \u003ctransform-filter>\\n```\\n\\nWird der `file` oder `raw-file` Parameter verwendet, wird nur eine einzelne Datei geladen. Der erste Parameter ist die URL von der die Datei ''importiert'' werden soll.\\n\\nWird der `files` Parameter verwendet, werden mehrere Dateien geholt. In diesem Fall ist der erste Parameter ein Filter, der eine Liste von URLs ergibt, von denen die Dateien gelesen werden sollen. Zum Beispiel: Mehrere Tiddler sind getaggt mit: `remote-server` und enthalten ein Feld: `url`. ... Der Filter `[tag[remote-server]get[url]]` wird alle verfügbaren URLs ansprechen.\\n\\nWerden die `raw-file` oder `raw-files` Varianten verwendet, wird der Klartext der Datei importiert. Es wird nicht versucht die Import-Logik anzuwenden.\\n\\nDer `\u003cimport-filter>` Parameter spezifiziert jene Tiddler, die importiert werden sollen. Ohne diesen Parameter wird standardmäßig `[all[tiddlers]]` als Filter verwendet.\\n\\nDer `\u003ctransform-filter>` Parameter, spezifiziert einen Filter, mit dem der Tiddler Name verändert werden kann. zB: `[addprefix[$:/meinImport/]]` würde `$:/meinImport/` allen Tiddler Namen voran stellen.\\n\\nWird `--verbose` vor dem `--fetch` Befehl benutzt, dann werden erweiterte Diagnose Infos ausgegeben.\\n\\nHinweis: TiddlyWiki wird ''keine'' veraltete Plugins importieren.\\n\\nDas folgende Beispiel wird alle \\\"nicht-system\\\" Tiddler von https://tiddlywiki.com holen und in ein `JSON` file speichern.\\n\\n```\\ntiddlywiki --verbose --fetch file \\\"https://tiddlywiki.com/\\\" \\\"[!is[system]]\\\" \\\"\\\" --rendertiddler \\\"$:/core/templates/exporters/JsonFile\\\" output.json text/plain \\\"\\\" exportFilter \\\"[!is[system]]\\\"\\n```\\n\\nDas folgende Beispiel holt die \\\"favicon\\\" Datei von tiddlywiki.com und speichert sie als \\\"output.ico\\\".\\n\\n```\\ntiddlywiki --verbose --fetch raw-file \\\"https://tiddlywiki.com/favicon.ico\\\" \\\"[[Icon Tiddler]]\\\" --savetiddler \\\"Icon Tiddler\\\" output.ico\\n```\\n\\n''Wichtig!''\\n\\nEs wird darauf hingewiesen, dass der Parameter `\\\"[[Icon Tiddler]]\\\"` für den `--fetch` Befehl zusätzliche Klammern enthält. Er wird hier als Tranformations-Filter verwendet!\\n\\nDer zweite `\\\"Icon Tiddler\\\"` Parameter für `--savetiddler` enthält keine eckigen Klammern. Er wird als Dateiname verwendet\\n\\n\"},\"$:/language/Help/help\":{\"title\":\"$:/language/Help/help\",\"description\":\"Anzeige der Hilfe für die TiddlyWiki Befehle.\",\"text\":\"Anzeige der Hilfe für die ~TiddlyWiki Befehle.\\n\\nBeispiel:\\n\\n```\\n--help [\u003ccommand>]\\n```\\n\\nWird der Parameter \u003ccommand> nicht angegeben, werden alle Befehle aufgelistet.\\n\"},\"$:/language/Help/import\":{\"title\":\"$:/language/Help/import\",\"description\":\"Importiert mehrere Tiddler aus einer Datei.\",\"text\":\"Dieser Befehl importiert / extrahiert Tiddler aus folgenden Dateien:\\n\\n* TiddlyWiki `*.html`\\n* `*.tiddler`\\n* `*.tid`\\n* `*.json`\\n* oder andere lokale `.text` Dateien\\n\\nDer `\u003cdeserializer>` Parameter muss angegeben werden. Anders als beim `--load` Befehl, der diese Information aus der Dateiendung ableiten kann.\\n\\n```\\n--import \u003cfilepath> \u003cdeserializer> [\u003ctitle>] [\u003cencoding>]\\n```\\n\\nTiddlyWiki enthält folgende `deserializer` Standard-Typen:\\n\\n* application/javascript\\n* application/json\\n* application/x-tiddler\\n* application/x-tiddler-html-div\\n* application/x-tiddlers\\n* text/html\\n* text/plain\\n\\nDer Tiddler-Titel entspricht nach dem Import, dem Dateinamen.\\n\\nDie Zeichenkodierung ist auf \\\"utf8\\\" eingestellt. Sie kann aber auf \\\"base64\\\" für binäre Daten geändert werden.\\n\\nHinweis: TiddlyWiki importiert nur neuere Plugins, als jene, die bereits geladen sind.\\n\"},\"$:/language/Help/init\":{\"title\":\"$:/language/Help/init\",\"description\":\"Initialisiere eine neues Wiki Verzeichnis.\",\"text\":\"Initialisiere eine neues [[Wiki Verzeichnis|WikiFolders]] mit der Kopie einer Edition.\\n\\n```\\n--init \u003cedition> [\u003cedition> ...]\\n```\\n\\nBeispiel:\\n\\n```\\ntiddlywiki ./MyWikiFolder --init empty\\n```\\n\\nAnmerkung:\\n\\n* Das Wiki Verzeichnis wird angelegt, wenn es nicht existiert.\\n* Der \u003cedition> Parameter ist standardmäßig: ''empty''.\\n* Der --init Befehl bricht ab, wenn das angegebene Verzeichnis nicht leer ist.\\n* Der --init Befehl löscht alle `includeWikis` Definitionen aus der neuen `tiddlywiki.info` Datei.\\n* Wenn mehrere Editionen importiert werden, wird die zuletzt importierte `tidlywiki.info` Datei aktiv sein. Alle anderen weden überschrieben.\\n\\n* `--editions` listet alle verfügbaren Editionen auf.\\n\"},\"$:/language/Help/listen\":{\"title\":\"$:/language/Help/listen\",\"description\":\"Definiert das HTTP-Server Interface für Tiddlywiki\",\"text\":\"Stellt das Wiki mit einem HTTP-Server zur Verfügung.\\n\\nDer \\\"listen\\\" Parameter wird wie folgt verwendet:\\n\\n```\\n--listen [\u003cname>=\u003cwert>]...\\n```\\n\\nAlle Parameter sind optional, die Reihenfolge ist beliebig und es werden \\\"sichere\\\" standard Parameter verwendet.\\n\\nMögliche Parameter:\\n\\n* ''host'' - Host-Name, von dem übertragen wird. (Standard: \\\"127.0.0.1\\\" alias \\\"localhost\\\")\\n* ''path-prefix'' - Pfad-prefix, der auf alle Pfade angewendet wird\\n* ''port'' - Port Nummer, die überwacht werden soll; Nicht-numerische Werte werden als System Umgebungs-Variable interpretiert. (Standard: 8080)\\n* ''credentials'' - Pfad zur Authentifizierungsdatei im CSV-format. Angabe ist relativ zum Wiki-Verzeichnis\\n* ''anon-username'' - Name, der für anonymer Benutzer verwendet wird, um bearbeitete Tiddler zu markieren\\n* ''username'' - Benutzername für die Basis-Authentifizierung\\n* ''password'' - Passwort für die Basis-Authentifizierung\\n* ''authenticated-user-header'' - Optionaler HTTP Header-Name für vertrauenswürdige, authentifizierte Benutzer\\n* ''readers'' - Komma-separierte Liste für Benutzer, mit Schreiberlaubnis\\n* ''writers'' - Komma-separierte Liste für Benutzer, mit Leseerlaubnis\\n* ''csrf-disable'' - \\\"yes\\\" bedeutet, dass CSRF Überprüfungen deaktiviert sind. (Standard: \\\"no\\\")\\n* ''root-tiddler'' - Tiddler, der für den \\\"Root-Pfad\\\" verwendet wird. (Standard: \\\"$:/core/save/all\\\")\\n* ''root-render-type'' - Darstellungs-Type, die für den Root-Tiddler verwendet wird. (Standard: \\\"text/plain\\\")\\n* ''root-serve-type'' - Inhalts-Type, die für den Root-Tiddler verwendet wird. (Standard: \\\"text/html\\\")\\n* ''tls-cert'' - Pfad zur \\\"TLS Zertifikat\\\" Datei (relativ zum Wiki Verzeichnis)\\n* ''tls-key'' - Pfad zur \\\"TLS Schlüssel\\\" Datei (relativ zum Wiki Verzeichnis)\\n* ''debug-level'' - \\\"debug\\\" bewikt eine detailierte Anzeige der HTTP Anfrage-Parameter. (Standard: \\\"none\\\")\\n* ''gzip'' - Wenn auf \\\"yes\\\" gesetzt, dann wird gzip Kompression aktiviert. (Standard: \\\"no\\\")\\n* ''use-browser-cache'' - Ist dieser Parameter auf \\\"yes\\\" gesetzt kann der Browser Inhalte zwischenspeichern um Übertragungsbandbreite zu sparen. (Standard: \\\"no\\\")\\n\\nFür weitere Sicherheitshinweise und Informationen für die Verwendung in lokalen Netzwerken siehe: WebServer auf TiddlyWiki.com\\n\"},\"$:/language/Help/load\":{\"title\":\"$:/language/Help/load\",\"description\":\"Lade Tiddler von einer Datei.\",\"text\":\"Lade Tiddler aus einer TiddlyWiki `.html`, `.tiddler`, `.tid`, `.json` oder anderen lokalen Datei.\\n\\nDie Verarbeitung der geladenen Datei wird anhand der Datei-Erweiterung bestimmt. Verwenden sie den alternativen `import` Befehl, wenn sie die verarbeitungsweise ändern möchten.\\n\\n\\n```\\n--load \u003cfilepath> [noerror]\\n--load \u003cdirpath> [noerror]\\n```\\n\\nDer \\\"load\\\" Befehl erzeugt eine Fehlermeldung, wenn keine Tiddler gefunden werden. Dieses Verhalten kann mit dem Parameter \\\"noerror\\\" unterdrückt werden.\\n\\nUm Daten aus einer verschlüsselten TiddlyWiki Datei zu laden, muss zuerst mit dem \\\"password\\\" Parameter ein Passwort definiert werden. \\n\\nBeispiel:\\n\\n```\\ntiddlywiki ./MyWiki --password hier-sicheres-passwort-verwenden --load my_encrypted_wiki.html\\n```\\n\\nHinweis: TiddlyWiki wird nur neuere Versionen eines bestehenden Plugins laden!\\n\"},\"$:/language/Help/makelibrary\":{\"title\":\"$:/language/Help/makelibrary\",\"description\":\"Erstellt die \\\"Upgrade Bibliothek\\\", die vom \\\"upgrade\\\" Prozess benötigt wird\",\"text\":\"Erstellt den tiddler: `$:/UpgradeLibrary`, der vom \\\"upgrade\\\" Prozess benötigt wird.\\n\\nDie \\\"Upgrade Bibliothek\\\" ist ein \\\"normales\\\" Plugin, vom Typ: `library`. Es enthält eine Kopie jedes Plugins, Themas und Sprachpacketes, das im TiddlyWiki Archiv enthalten ist.\\n\\nDieser Befehl ist ein \\\"interner\\\" Befehl! Er ist nur relevant für Benutzer, die einen spezifischen \\\"Upgrade Prezess\\\" erstellen müssen. zB: Umwandeln von einem Tiddler in mehrere Tiddler, um Inkompatibilitäten zu vermeiden.\\n\\n```\\n--makelibrary \u003ctitle>\\n```\\n\\nDas \\\"title\\\" Argument ist standardmäßig: `$:/UpgradeLibrary`.\\n\"},\"$:/language/Help/notfound\":{\"title\":\"$:/language/Help/notfound\",\"text\":\"Keine Hilfe zu diesem Thema gefunden!\"},\"$:/language/Help/output\":{\"title\":\"$:/language/Help/output\",\"description\":\"Setzt das Basis Ausgabeverzeichnis für alle folgenden Befehle.\",\"text\":\"Setzt das Basis Ausgabeverzeichnis für alle folgenden Befehle. Das Standard Verzeichnis heißt: \\\"output\\\" und ist ein Unterverzeichnis des \\\"edition\\\" Verzeichnisses.\\n\\n```\\n--output \u003cpathname>\\n```\\n\\nIst das spezifizierte Verzeichnis \\\"relativ\\\", dann wird es relativ zum bestehenden Arbeitsverzeichnis angelegt.\\nZum Beispiel: `--output .` setzt das Ausgabeverzeichnis auf das aktuelle Verzeichnis.\\n\"},\"$:/language/Help/password\":{\"title\":\"$:/language/Help/password\",\"description\":\"Setzen eines Passwortes für Verschlüsselungsoperationen.\",\"text\":\"Setzen eines Passwortes für Verschlüsselungsoperationen\\n\\n```\\n--password \u003cpassword>\\n```\\n\\nHinweis: Diese Option kann nicht verwendet werden, um ein \\\"Server Passwort\\\" festzulegen! Informationen zum Server Passwort siehe [[ServerCommand]].\\n\"},\"$:/language/Help/render\":{\"title\":\"$:/language/Help/render\",\"description\":\"Ausgabe individueller Tiddler in Dateien\",\"text\":\"Individuelle Tiddler werden anhand von Filtern spezifiziert, gelesen und in Dateien umgewandelt.\\n\\nOptionell kann eine Template-Datei angegeben werden. In diesem Fall wird nicht der Inhalt des Tiddlers, sondern des Templates übersetzt. Die `currentTiddler` Variable wird auf den Titel, des auszugebenden, Tiddlers gesetzt.\\n\\nEs können noch zusätzliche Variablen per Name und Wert gesetzt werden.\\n\\n```\\n--render \u003ctiddler-filter> [\u003cfilename-filter>] [\u003crender-type>] [\u003ctemplate>] [ [\u003cname>] [\u003cvalue>] ]*\\n```\\n\\n* ''tiddler-filter'': Ein Filter, der die Auszugebenden Tiddler eindeutig spezifiziert.\\n* ''filename-filter'': [Option] Filter, der aus Tiddler Titeln, Pfadnamen generiert. Wenn weggelassen, dann wird der Standard verwendet: `[is[tiddler]addsuffix[.html]]`, welcher den Titel als Dateiname verwendet.\\n* ''render-type'': [Option] Ausgabe Typ: `text/html` (Standard) generiert HTML Text und `text/plain` gibt den \\\"reinen\\\" Text Inhalt zurück. `text/plain` ignoriert HTML Marker und andere \\\"nicht-druckbare\\\" Zeichen.\\n* ''template'': [Option] Template, das verwendet werden soll\\n* ''name'': [Option] Name einer zusätzlichen Variablen.\\n* ''value'': [Option] Wert dieser zusätzlichen Variablen.\\n\\nStandardmäßig sind die Dateinamen \\\"relativ\\\" zum `output` Verzeichnis, des `edition` Verzeichnisses.\\n\\nMit dem `--output` Befehl kann die Ausgabe in jedes beliebige Verzeichnis umgeleitet werden.\\n\\nWichtig:\\n\\n* Das `output` Verzeichnis wird nicht gelöscht, bevor neue Dateien geschrieben werden.\\n* Verzeichnisse und Dateien werden automatisch angelegt, sollten sie nicht vorhanden sein.\\n* Wenn eine Datei Leerzeichen enthält, dann muss dies ''doppelt'' angezeigt werden. Für TiddlyWiki mit eckigen Klammern `[[]]` und für die Kommandozeile mit Hochkomma \\\"\\\". Zum Beispiel: `--render \\\"[[Motovun Jack.jpg]]\\\"`\\n* Dateinamens-Filter zeigen immer auf den Titel, des gerade bearbeiteten Tiddlers. Das erlaubt uns, diesen als Basis für den Dateinamen zu verwenden. zB: `[encodeuricomponent[]addprefix[static/]]` ... Verwendet eine URI-Enkodierung für jeden Dateinamen und stellt das Wort `static/` als Pfadname voran.\\n* Es können mehrere ''name/value'' Paare verwendet werden.\\n* Der `--render` Befehl ist flexibler und ersetzt daher `--rendertiddler` und `--rendertiddlers`, welche mit V5.1.15 auslaufen!\\n\\nBeispiel:\\n\\n* `--render '[!is[system]]' '[encodeuricomponent[]addprefix[tiddlers/]addsuffix[.html]]'` ... Übersetzt alle Nicht-System Tiddler und schreibt sie in ein Unterverzeichnis `tiddlers/` mit URL-kodiertem Titel und der Erweiterung `.html`\\n\\n* `--render '.' 'tiddlers.json' 'text/plain' '$:/core/templates/exporters/JsonFile' 'exportFilter' '[tag[HelloThere]]'` -- Übersetzt all Tiddler mit dem Tag: \\\"HelloThere\\\" in eine JSON Datei mit dem namen \\\"tiddlers.json\\\"\\n\"},\"$:/language/Help/rendertiddler\":{\"title\":\"$:/language/Help/rendertiddler\",\"description\":\"Ausgabe eines individuellen Tiddlers, in einem spezifizierten Format.\",\"text\":\"''WICHTIG:''\\n\\n* Der `--rendertiddler` Befehl wird ab V5.1.15 durch `--render` ersetzt.\\n* `--rendertiddler` wird auslaufen und sollte daher nicht mehr verwendet werden!\\n\\nAusgabe eines individuellen Tiddlers, in einem spezifizierten Format (standard: `text/html`) und Dateinamen.\\n\\nOptional kann ein Template tiddler angegeben werden. Die \\\"currentTiddler\\\" Variable wird auf den Tiddler gesetzt, der zu rendern ist.\\n\\n```\\n--rendertiddler \u003ctitle> \u003cfilename> [\u003ctype>] [\u003ctemplate>] [\u003cname>] [\u003cvalue>]\\n```\\n\\nStandardmäßig ist das `output` Verzeichnis ein Unterverzeichnis im `edition` Verzeichnis. Der `--output` Befehl kann verwendet werden, um ein anderes Verzeichnis auszuwählen.\\n\\nNicht vorhandene Verzeichnisse werden automatisch erstellt.\\n\\n''Beispiel:''\\n\\nDer folgende Befehl speichert alle tiddler mit dem `tag: done` in eine `JSON` Datei mit dem Namen: `output.json`. Das Template `$:/core/templates/exporters/JsonFile` wird auf die zu speichernden Daten angewandt.\\n\\n```\\n--rendertiddler \\\"$:/core/templates/exporters/JsonFile\\\" output.json text/plain \\\"\\\" exportFilter \\\"[tag[done]]\\\"\\n```\\n\"},\"$:/language/Help/rendertiddlers\":{\"title\":\"$:/language/Help/rendertiddlers\",\"description\":\"Gefilterte Ausgabe von Tiddlern, in einem spezifizierten Format.\",\"text\":\"''WICHTIG:''\\n\\n* Der `--rendertiddlers` Befehl wird ab V5.1.15 durch `--render` ersetzt.\\n* `--rendertiddlers` wird auslaufen und sollte daher nicht mehr verwendet werden!\\n\\nGefilterte Ausgabe mehrerer Tiddler, in ein angegebenes Dateiformat (standard: `text/html`) mit spezifischer Erweiterung (Standard: `.html`).\\n\\n```\\n--rendertiddlers '\u003cfilter>' \u003ctemplate> \u003cpathname> [\u003ctype>] [\u003cextension>] [\\\"noclean\\\"]\\n```\\n\\nBeispiel:\\n\\n```\\n--rendertiddlers '[!is[system]]' $:/core/templates/static.tiddler.html ./static text/plain\\n```\\n\\nStandardmäßig ist das `output` Verzeichnis ein Unterverzeichnis im `edition` Verzeichnis. Der `--output` Befehl kann verwendet werden, um ein anderes Verzeichnis auszuwählen.\\n\\nNicht vorhandene Verzeichnisse werden automatisch erstellt und enthaltene Dateien werden gelöscht. Mit dem \\\"noclean\\\" Parameter, kann das löschen vorhandener Dateien unterdrückt werden.\\n\"},\"$:/language/Help/save\":{\"title\":\"$:/language/Help/save\",\"description\":\"Speichert Klartext Tiddler als Dateien\",\"text\":\"Speichert einzelne oder mehrere Klartext Tiddler als Text oder im Binärformat in Dateien. Die zu speichernden Tiddler werden über Filter spezifiziert.\\n\\n```\\n--save \u003ctiddler-filter> \u003cfilename-filter>\\n```\\n\\n* ''tiddler-filter'': Ein Filter, der die zu speichernden Tiddler anzeigt.\\n* ''filename-filter'': [Option] Ein Filter, der die Tiddler Titel in Verzeichnis Namen aufspaltet. Wenn nicht spezifiziert, dann wird: `[is[tiddler]]` verwendet. `[is[tiddler]]` übernimmt den Tiddler Titel unverändert.\\n\\nStandardmäßig sind die Dateinamen \\\"relativ\\\" zum `output` Verzeichnis, des `edition` Verzeichnisses.\\n\\nMit dem `--output` Befehl kann die Ausgabe in jedes beliebige Verzeichnis umgeleitet werden.\\n\\nHinweise:\\n\\n* Das `output` Verzeichnis wird nicht gelöscht, bevor neue Dateien geschrieben werden.\\n* Verzeichnisse und Dateien werden automatisch angelegt, sollten sie nicht vorhanden sein.\\n* Wenn eine Datei Leerzeichen enthält, dann muss dies ''doppelt'' angezeigt werden. Für TiddlyWiki mit eckigen Klammern `[[]]` und für die Kommandozeile mit Hochkomma \\\"\\\". Zum Beispiel: `--render \\\"[[Motovun Jack.jpg]]\\\"`\\n* Dateinamens-Filter zeigen immer auf den Titel, des gerade umzusetzenden Tiddlers. Das erlaubt uns, diesen als Basis für den Dateinamen zu verwenden. zB: `[encodeuricomponent[]addprefix[static/]]` ... Verwendet eine URI-Enkodierung für jeden Dateinamen und stellt das Wort `static/` als Pfadname voran.\\n* Der `--save` Befehl ist flexibler und ersetzt daher `--savetiddler` und `--savetiddlers`, welche mit V5.1.15 auslaufen!\\n\\nBeispiel:\\n\\n* `--save \\\"[!is[system]is[image]]\\\" \\\"[encodeuricomponent[]addprefix[tiddlers/]]\\\"` -- Übersetzt alle Nicht-System Bild Tiddler in Datein und schreibt diese URL-kodiert in das Unterverzeichnis `tiddlers/`\\n\"},\"$:/language/Help/savetiddler\":{\"title\":\"$:/language/Help/savetiddler\",\"description\":\"Speichert einen Tiddler als File.\",\"text\":\"''WICHTIG:''\\n\\n* Der `--savetiddler` Befehl wird ab V5.1.15 durch `--save` ersetzt. \\n* `--savetiddler` wird auslaufen und sollte daher nicht mehr verwendet werden!\\n\\nSpeichert einen individuellen Tiddler im Text- oder Binärformat mit dem angegebenen Dateinamen.\\n\\n```\\n--savetiddler \u003ctitle> \u003cfilename>\\n```\\n\\nStandardmäßig ist das `output` Verzeichnis ein Unterverzeichnis im `edition` Verzeichnis. Der `--output` Befehl kann verwendet werden, um ein anderes Verzeichnis auszuwählen.\\n\\nNicht vorhandene Verzeichnisse werden automatisch erstellt.\\n\"},\"$:/language/Help/savetiddlers\":{\"title\":\"$:/language/Help/savetiddlers\",\"description\":\"Speichert eine Gruppe von Tiddler in ein Verzeichnis\",\"text\":\"''WICHTIG:''\\n\\n* Der `--savetiddlers` Befehl wird ab V5.1.15 durch `--save` ersetzt. \\n* `--savetiddlers` wird auslaufen und sollte daher nicht mehr verwendet werden!\\n\\nSpeichert eine Gruppe von Tiddler im Text- oder Binärformat in ein angegebenes Verzeichnis.\\n\\n```\\n--savetiddlers \u003cfilter> \u003cpathname> [\\\"noclean\\\"]\\n```\\n\\nStandardmäßig ist das `output` Verzeichnis ein Unterverzeichnis im `edition` Verzeichnis. Der `--output` Befehl kann verwendet werden, um ein anderes Verzeichnis auszuwählen.\\n\\nWichtig: Alle Dateien im Ausgabeverzeichnis werden automatisch gelöscht, wenn dieser Befehl verwendet wird. Um dies zu verhindern kann der ''noclean'' Parameter verwendet werden.\\n\\nNicht vorhandene Verzeichnisse im Pfadnamen werden automatisch erstellt.\\n\"},\"$:/language/Help/savewikifolder\":{\"title\":\"$:/language/Help/savewikifolder\",\"description\":\"Speichert ein Wiki in einen neues Verzeichnis\",\"text\":\"\u003c\u003c.from-version \\\"5.1.20\\\">> Speichert das aktuelle Wiki als ein Wiki-Verzeichnis. Inklusive Tiddlern, Plugins und Konfiguration:\\n\\n```\\n--savewikifolder \u003cwikifolderpath> [\u003cfilter>] [ [\u003cname>=\u003cvalue>] ]*\\n```\\n\\n* Das Zielverzeichnis muss leer sein, oder nicht existent\\n* Der \\\"filter\\\" Parameter definiert, welche Tiddler inkludiert werden. Diser Parameter is optional. Standard: `[all[tiddlers]]`\\n* Plugins des offiziellen Plugin-Verzeichnisses werden durch Referenzen zu den Plugins in der `tiddlywiki.info` Datei ersetzt.\\n* Drittanbieter Plugins werden in ihre eigenen Verzeichnisse entpackt\\n\\nFolgende Optionen werden unterstützt:\\n\\n* ''filter'': Ein \\\"Filter-Run\\\" der die Tiddler definiert, die ausgegeben werden sollen.\\n\\n* ''explodePlugins'': Standard ist: \\\"yes\\\"\\n** \\\"yes\\\": wird Plugins \\\"aufspalten\\\" und einzelne \\\"Shadow Tiddler\\\" in ein  \\\"tiddlers/\u003cplugin>\\\" Verzeichnis speichern.\\n** \\\"no\\\": Wird das \\\"aufspalten\\\" von Plugins in einzelne \\\"Shadow Tiddler\\\" unterbinden. Das plugin selbst wird als 1 JSON Tiddler gespeichert.\\n\\nDiese Funktionen werden vor allem dazu verwendet, eine Wiki-Datei in einzelne Tiddler in einem Wiki-Verzeichnis umzuwandeln:\\n\\n```\\ntiddlywiki --load ./mywiki.html --savewikifolder ./mywikifolder\\n```\\n\\nDer folgende Befehl wird das Plugin als JSON-Tiddler in das \\\"tiddlers\\\" Verzeichnis speichern:\\n\\n```\\ntiddlywiki --load ./mywiki.html --savewikifolder ./mywikifolder explodePlugins=no\\n```\"},\"$:/language/Help/server\":{\"title\":\"$:/language/Help/server\",\"description\":\"(Dieser Befehl ist abgekündigt! - Neu ist: \\\"listen\\\") -- Stellt einen HTTP server für TiddlyWiki zur Verfügung.\",\"text\":\"''WICHTIG:''\\n\\n* Dieser Befehl ist abgekündigt!\\n* Wird durch: \\\"listen\\\" ersetzt.\\n\\nTiddlyWiki bringt einen einfachen Web-Server mit.\\n\\nDer Server kann spezifische Tiddler im angegebenen Format anzeigen (rendern). Zudem können einzelne, oder mehrere Tiddler im JSON Format übertragen werden. Die unterstützten HTTP Funktionen sind: `GET`, `PUT` und `DELETE`\\n\\n```\\n--server \u003cport> \u003croot-tiddler> \u003croot-render-type> \u003croot-serve-type> \u003cusername> \u003cpassword> \u003chost> \u003cpath-prefix> \u003cdebug-level>\\n```\\n\\nDie Parameter sind: \\n\\n* ''port'' - Port Nummer mit der kommuniziert werden soll (Standard: \\\"8080\\\"). Ein \\\"nicht-numerisher\\\" Wert wird als System-Umgebungsvariable interpretiert, von der der Wert gelesen werden soll.\\n* ''root-tiddler'' - Der Tiddler, der als ~Basis-Tiddler verwendet werden soll ( Standard: \\\"$:/core/save/all\\\").\\n* ''root-render-type'' -  MIME-Type, zu dem der ~Basis-Tiddler \\\"gerendert\\\" werden soll ( Standard: \\\"text/plain\\\").\\n* ''root-serve-type'' - MIME-Type, mit dem der Basis-Tiddler ausgeliefert werden soll ( Standard: \\\"text/html\\\").\\n* ''username'' - Benutzer Name, mit dem veränderte Tiddler signiert werden.\\n* ''password'' - Passwort mit dem eine sehr \\\"simple\\\" Zugangsbeschränkung aufgebaut werden kann.\\n* ''host'' - ~Host-Name von dem ausgeliefert werden soll. Host ist optional ( Standard: \\\"127.0.0.1\\\" oder auch \\\"localhost\\\").\\n* ''path-prefix'' - Optionales prefix für Pfade.\\n* ''debug-level'' - \\\"debug\\\" bewikt eine detailierte Anzeige der HTTP Anfrage-Parameter. (Standard: \\\"none\\\")\\n\\nWenn beim Serverstart ein Passwort angegeben wird, dann wird der Benutzer aufgefordert den Benutzernamen und das Passwort einzugeben, bevor ein Wiki angezeigt wird. ACHTUNG: Das Passwort wird im Klartext übertragen. Diese Vorgehensweise ist nicht für den Einsatz im Netz geeignet.\\n\\nBeispiel:\\n\\n```\\n--server 8080 $:/core/save/all text/plain text/html MeinBenutzerName passw0rt\\n```\\n\\nDer Name und das Passwort können als \\\"leere\\\" Zeichenketten definiert werden, wenn ein \\\"hostname\\\" oder \\\"pathprefix\\\" nötig ist, jedoch kein Passwort verwendet werden soll.\\n\\n```\\n--server 8080 $:/core/save/all text/plain text/html \\\"\\\" \\\"\\\" 192.168.0.245\\n```\\n\\nWenn Sie eine Addresse wie oben verwenden, dann ist der Server für das lokale Netzwerk sichtbar. Weitere Sicherheitshinweise finden sie unter: WebServer auf tiddlywiki.com\\n\\nEs ist möglich mehrere TiddlyWiki Server gleichzeitig zu starten. Jeder Server muss jedoch mit einem eigenen Port gestartet werden. Es kann sinnvoll sein, den Prozess mit lokalen \\\"Umgebungsvariable\\\" zu starten. Hier wird \\\"MEINE_PORT_NUMMER\\\" als Beispiel verwendet.\\n\\n\\n```\\n--server MEINE_PORT_NUMMER $:/core/save/all text/plain text/html MyUserName passw0rd\\n```\"},\"$:/language/Help/setfield\":{\"title\":\"$:/language/Help/setfield\",\"description\":\"Experimentell - Setzt ein Tiddler \\\"field\\\" auf einen bestimmten Wert\",\"text\":\"//Wichtig! Dieser Befehl is experimentell und kann während der Betaphase geändert oder ersetzt werden!//\\n\\nSetzt ein spezifiziertes Feld, für eine Gruppe von Tiddlern. Ein Template wird \\\"wikifiziert\\\" und das Ergebnis in das Feld geschrieben. Die `currentTiddler` Variable wird auf den jeweiligen Tiddler gesetzt.\\n\\n```\\n--setfield \u003cfilter> \u003cfieldname> \u003ctemplatetitle> \u003crendertype>\\n```\\n\\nThe parameters are:\\n\\n* ''filter'' - Filter, der die zu modifizierenden Tiddler auswählt.\\n* ''fieldname'' - Das zu verändernde Feld (Standardwert: \\\"text\\\").\\n* ''templatetitle'' - Der zu wikifizierende Vorlagen Tiddler, dessen Ergebnis in das Feld geschrieben wird. Wenn Leer, dann wird das Feld gelöscht.\\n* ''rendertype'' - Der Text Typ für den \\\"rendering\\\" Vorgang (Standardwert: \\\"text/plain\\\"; \\\"text/html\\\" kann verwendet werden, um \\\"HTML tags\\\" zu erzeugen).\\n\"},\"$:/language/Help/unpackplugin\":{\"title\":\"$:/language/Help/unpackplugin\",\"description\":\"Extrahiere Tiddler aus einem Plugin\",\"text\":\"Extrahiert alle Tiddler aus einem plugin und schreibt diese als einzelne Tiddler Dateien:\\n\\n```\\n--unpackplugin \u003ctitle>\\n```\\n\"},\"$:/language/Help/verbose\":{\"title\":\"$:/language/Help/verbose\",\"description\":\"Aktiviert die erweiterte Fehlerausgabe.\",\"text\":\"Aktiviert die erweiterte Fehlerausgabe. Nützlich um Fehler zu finden.\\n\\n```\\n--verbose\\n```\\n\"},\"$:/language/Help/version\":{\"title\":\"$:/language/Help/version\",\"description\":\"Gibt die Versionsnummer von TiddlyWiki aus.\",\"text\":\"Gibt die Versionsnummer von TiddlyWiki aus.\\n\\n```\\n--version\\n```\\n\"},\"$:/language/Import/Editor/Import/Heading\":{\"title\":\"$:/language/Import/Editor/Import/Heading\",\"text\":\"Bilder in den Editor importieren.\"},\"$:/language/Import/Imported/Hint\":{\"title\":\"$:/language/Import/Imported/Hint\",\"text\":\"Folgende Tiddler wurden importiert:\"},\"$:/language/Import/Listing/Cancel/Caption\":{\"title\":\"$:/language/Import/Listing/Cancel/Caption\",\"text\":\"Abbrechen\"},\"$:/language/Import/Listing/Cancel/Warning\":{\"title\":\"$:/language/Import/Listing/Cancel/Warning\",\"text\":\"Möchten Sie den Import abbrechen?\"},\"$:/language/Import/Listing/Hint\":{\"title\":\"$:/language/Import/Listing/Hint\",\"text\":\"Diese Tiddler können importiert werden:\"},\"$:/language/Import/Listing/Import/Caption\":{\"title\":\"$:/language/Import/Listing/Import/Caption\",\"text\":\"Importieren\"},\"$:/language/Import/Listing/Select/Caption\":{\"title\":\"$:/language/Import/Listing/Select/Caption\",\"text\":\"Auswahl\"},\"$:/language/Import/Listing/Status/Caption\":{\"title\":\"$:/language/Import/Listing/Status/Caption\",\"text\":\"Status\"},\"$:/language/Import/Listing/Title/Caption\":{\"title\":\"$:/language/Import/Listing/Title/Caption\",\"text\":\"Titel\"},\"$:/language/Import/Listing/Preview\":{\"tit ditShadowTiddler\":{\"title\":\"$:/language/ConfirmEditShadowTiddler\",\"text\":\"Sie sind dabei, einen Schatten-Tiddler zu verändern. Zukünftige, automatische Anpassungen werden dadurch unterdrückt. Sie können Ihre Änderungen rückgängig machen, indem Sie diesen Tiddler wieder löschen. Wollen Sie den Tiddler: \\\"\u003c$text text=\u003c\u003ctitle>>/>\\\" ändern?\"},\"$:/language/ConfirmAction\":{\"title\":\"$:/language/ConfirmAction\",\"text\":\"Möchten Sie weitermachen?\"},\"$:/language/Count\":{\"title\":\"$:/language/Count\",\"text\":\"Anzahl\"},\"$:/language/DefaultNewTiddlerTitle\":{\"title\":\"$:/language/DefaultNewTiddlerTitle\",\"text\":\"Neuer Tiddler\"},\"$:/language/Diffs/CountMessage\":{\"title\":\"$:/language/Diffs/CountMessage\",\"text\":\"\u003c\u003cdiff-count>> Unterschied(e)\"},\"$:/language/DropMessage\":{\"title\":\"$:/language/DropMessage\",\"text\":\"Hierher ziehen (oder Escape um abzubrechen)\"},\"$:/language/Encryption/Cancel\":{\"title\":\"$:/language/Encryption/Cancel\",\"text\":\"Abbrechen\"},\"$:/language/Encryption/ConfirmClearPassword\":{\"title\":\"$:/language/Encryption/ConfirmClearPassword\",\"text\":\"Wollen Sie das Passwort löschen? Damit wird die Verschlüsselung beim nächsten Speichervorgang abgeschalten!\"},\"$:/language/Encryption/PromptSetPassword\":{\"title\":\"$:/language/Encryption/PromptSetPassword\",\"text\":\"Der TiddlyWiki Inhalt wird mit dem nächsten Speichern verschlüsselt!\"},\"$:/language/Encryption/Username\":{\"title\":\"$:/language/Encryption/Username\",\"text\":\"Benutzername\"},\"$:/language/Encryption/Password\":{\"title\":\"$:/language/Encryption/Password\",\"text\":\"Passwort\"},\"$:/language/Encryption/RepeatPassword\":{\"title\":\"$:/language/Encryption/RepeatPassword\",\"text\":\"Passwort wiederholen\"},\"$:/language/Encryption/PasswordNoMatch\":{\"title\":\"$:/language/Encryption/PasswordNoMatch\",\"text\":\"Passwörter stimmen nicht überein\"},\"$:/language/Encryption/SetPassword\":{\"title\":\"$:/langua {"title":"Anmelden und abmelden","tags":"Anleitung","lang":"de","text":"DE: **Anmelden und abmelden** · EN: [[Signing in and out]] · [[Start]]\n\n# Anmelden und abmelden\n\n- Öffne die Startseite des MultiWiki-Servers.\n- Gib Benutzernamen und Passwort ein und klicke **Anmelden**.\n- Abmelden: Klicke oben rechts auf das Menü und wähle **Abmelden**.\n- Wer noch keinen Zugang hat, erhält eine Einladung von einem Lehrer oder Admin (siehe [[Nutzer verwalten]])."},
{"title":"Autosave","tags":"Anleitung","lang":"en","text":"EN: **Autosave** · DE: [[Autospeicherung]] · [[Start]]\n\n# Autosave\n\n- The MultiWiki server saves every change **automatically** — nothing needs manual backup.\n- While you work in a wiki, each change is stored.\n- Note: the [[Preview image]] is not redrawn on every save — it shows the state after the latest editing pause."},
{"title":"Autospeicherung","tags":"Anleitung","lang":"de","text":"DE: **Autospeicherung** · EN: [[Autosave]] · [[Start]]\n\n# Autospeicherung\n\n- Der MultiWiki-Server speichert jede Änderung **automatisch** — Du brauchst nichts manuell zu sichern.\n- Solange Du in einem Wiki arbeitest, wird bei jedem Wechsel gespeichert.\n- Hinweis: Die Vorschau ([[Vorschau-Bild]]) wird nicht bei jedem Speichern aktualisiert — sie zeigt den Stand nach der letzten Bearbeitungspause."},
{"title":"Backup","tags":"Anleitung","lang":"en","text":"EN: **Backup** · DE: [[Sicherung]] · [[Start]]\n\n# Backup\n\n- The MultiWiki server offers an **admin backup**: a single file containing database, keys and configuration.\n- Start the download in the **Backup section**.\n- Store backups somewhere safe (they contain operational secrets).\n- Create a backup regularly before making larger changes."},
{"title":"Bags and roles","tags":"Anleitung","lang":"en","text":"EN: **Bags and roles** · DE: [[Bags und Rollen]] · [[Start]]\n\n# Bags and roles\n\n- **Bags** are storage containers — every wiki has a bag that holds its content.\n- **Roles** bundle rights; the basics are explained under [[Roles and permissions]].\n- The **Roles tab** lists all roles with their rights and the protected system roles.\n- For normal use no manual work is needed: the wiki dialog sets rights automatically."},
{"title":"Bags und Rollen","tags":"Anleitung","lang":"de","text":"DE: **Bags und Rollen** · EN: [[Bags and roles]] · [[Start]]\n\n# Bags und Rollen\n\n- **Bags** sind Speicher-Container — jedes Wiki hat einen zugeordneten Bag, in dem seine Inhalte liegen.\n- **Rollen** bündeln Rechte; die wichtigsten liest Du unter [[Rechte und Rollen]].\n- Der **Rollen-Tab** zeigt alle Rollen samt Rechten und geschützter System-Rollen.\n- Für normale Nutzung ist kein Eingriff nötig: Der Wikis-Dialog setzt Rechte automatisch."},
{"title":"Bearbeiten und speichern","tags":"Anleitung","lang":"de","text":"DE: **Bearbeiten und speichern** · EN: [[Editing and saving]] · [[Start]]\n\n# Bearbeiten und speichern\n\n- Klicke im Wiki auf einen Text, um ihn zu bearbeiten.\n- Nach dem Bearbeiten wegklicken oder speichern — Änderungen werden sofort gespeichert ([[Autospeicherung]]).\n- Dateien fügen Lehrkräfte und Wiki-Besitzer über den Upload ein (siehe [[Datei in einem Wiki verwenden]]).\n- Du kannst nur bearbeiten, wenn Du Schreibrechte hast."},
{"title":"Creating a new wiki","tags":"Anleitung","lang":"en","text":"EN: **Creating a new wiki** · DE: [[Ein neues Wiki anlegen]] · [[Start]]\n\n# Creating a new wiki\n\n- Go to the home page and click **New wiki**.\n- Enter a display name (and optionally a description).\n- A **slug** (short name, e.g. `my-wiki`) is generated; it may only contain lowercase letters, numbers and hyphens, and must be free.\n- Teachers and admins can choose from [[Templates]]; students get their own starter wiki.\n- Students: whether you may create wikis depends on the limit your teacher set ([[Wiki limits for students]])."},
{"title":"Datei hochladen","tags":"Anleitung","lang":"de","text":"DE: **Datei hochladen** · EN: [[Uploading a file]] · [[Start]]\n\n# Datei hochladen\n\n- Unter **Meine Dateien** kannst Du Dateien in Deinen persönlichen Bereich hochladen.\n- Dort siehst Du die Anzahl Deiner Dateien und kannst alte löschen.\n- Die Dateien stehen Dir dann zur Verfügung, um sie in ein Wiki einzubinden ([[Datei in einem Wiki verwenden]])."},
{"title":"Datei in einem Wiki verwenden","tags":"Anleitung","lang":"de","text":"DE: **Datei in einem Wiki verwenden** · EN: [[Using a file in a wiki]] · [[Start]]\n\n# Datei in einem Wiki verwenden\n\n- **Datei-Upload im Wiki:** Beim Bearbeiten eines Wikis lädst Du die Datei direkt dort hoch — sie landet beim Besitzer des Wikis.\n- **Wiki-Besitzer (Lehrer/Admin):** In eigenen Wikis hochgeladene Dateien stehen dem Wiki dauerhaft zur Verfügung.\n- Bilder erscheinen als Bild, andere Dateien als Download-Link.\n- Gäste mit Leserecht sehen die Inhalte mit, können aber keine Dateien hinzufügen."},
{"title":"Deleting a wiki","tags":"Anleitung","lang":"en","text":"EN: **Deleting a wiki** · DE: [[Wiki löschen]] · [[Start]]\n\n# Deleting a wiki\n\n- Only the **owner** of the wiki or the **admin** can delete it.\n- Wiki list → **Edit** → **Delete** and confirm.\n- Deleting removes the wiki contents and the preview image **immediately** — there is no undo.\n- Leftover preview files of deleted wikis are cleaned up automatically at the next server start."},
{"title":"Editing and saving","tags":"Anleitung","lang":"en","text":"EN: **Editing and saving** · DE: [[Bearbeiten und speichern]] · [[Start]]\n\n# Editing and saving\n\n- Click any text in the wiki to edit it.\n- Click away or save — changes are stored immediately ([[Autosave]]).\n- Teachers and wiki owners add files through the upload (see [[Using a file in a wiki]]).\n- You can only edit wikis you have write access to."},
{"title":"Ein Wiki öffnen","tags":"Anleitung","lang":"de","text":"DE: **Ein Wiki öffnen** · EN: [[Opening a wiki]] · [[Start]]\n\n# Ein Wiki öffnen\n\n- Öffne die Startseite und klicke auf das Vorschaubild oder den Namen des Wikis.\n- Du siehst nur Wikis, für die Du Leserechte hast (siehe [[Rechte und Rollen]]).\n- Ein Wiki ohne Vorschaubild wird erst beim ersten Öffnen gerendert — das kann ein paar Sekunden dauern."},
{"title":"Ein neues Wiki anlegen","tags":"Anleitung","lang":"de","text":"DE: **Ein neues Wiki anlegen** · EN: [[Creating a new wiki]] · [[Start]]\n\n# Ein neues Wiki anlegen\n\n- Gehe auf die Startseite und klicke **Neues Wiki**.\n- Vergib einen Anzeigenamen (und optional eine Beschreibung).\n- Ein **Slug** (Kurzname, z. B. `mein-wiki`) wird passend erzeugt; er darf nur Kleinbuchstaben, Zahlen und Bindestriche enthalten und muss frei sein.\n- Lehrer und Admins können aus [[Vorlagen]] wählen; Schüler bekommen ein eigenes Start-Wiki.\n- Schüler: Ob Du Wikis anlegen darfst, entscheidet die Wiki-Grenze, die Dein Lehrer setzt ([[Wiki-Limit für Schüler]])."},
{"title":"Enabling students","tags":"Anleitung","lang":"en","text":"EN: **Enabling students** · DE: [[Schüler freischalten]] · [[Start]]\n\n# Enabling students\n\n- In the Users tab, create the student accounts (invitation) and assign them a class role.\n- With that role students cannot look into foreign wikis — they only see what is explicitly shared with them ([[Sharing a wiki with a class]]).\n- Then decide how many **own wikis** a student may create ([[Wiki limits for students]])."},
{"title":"Inviting someone","tags":"Anleitung","lang":"en","text":"EN: **Inviting someone** · DE: [[Jemanden einladen]] · [[Start]]\n\n# Inviting someone\n\n**Create a new account** (admin/teacher): In the Users tab choose **Invite user** — enter name and email; the person sets their own password on first sign-in.\n\n**Bring someone into your own wiki:** Edit the wiki in the wiki dialog and add that person's role under **\"Who may write this wiki\"** (e.g. their personal role). They then see the wiki in their list and can read and write ([[Roles and permissions]])."},
{"title":"Jemanden einladen","tags":"Anleitung","lang":"de","text":"DE: **Jemanden einladen** · EN: [[Inviting someone]] · [[Start]]\n\n# Jemanden einladen\n\n**Neues Konto anlegen** (Admin/Lehrer): Im Users-Tab **Nutzer einladen** — Name und E-Mail angeben; die Person legt ihr Passwort beim ersten Anmelden selbst fest.\n\n**Punktuell in ein eigenes Wiki holen:** Im Wikis-Dialog das Wiki bearbeiten und bei **„Wer darf das Wiki schreiben\"** die zugehörige Rolle der Person eintragen (z. B. deren persönliche Rolle). Sie sieht das Wiki dann in ihrer Liste und kann lesen und schreiben ([[Rechte und Rollen]])."},
{"title":"Managing users","tags":"Anleitung","lang":"en","text":"EN: **Managing users** · DE: [[Nutzer verwalten]] · [[Start]]\n\n# Managing users\n\n- The **Users tab** lists all accounts with their roles.\n- **Invite:** create a new account (name, email) — the person sets their own password.\n- **Roles:** assign or remove roles.\n- **Reset password:** if someone is locked out, you can set a new password.\n- **Delete:** remove accounts; note that access to their wikis is lost as well.\n- System roles (e.g. `ADMIN`) are protected and cannot be deleted."},
{"title":"Nutzer verwalten","tags":"Anleitung","lang":"de","text":"DE: **Nutzer verwalten** · EN: [[Managing users]] · [[Start]]\n\n# Nutzer verwalten\n\n- Im **Users-Tab** siehst Du alle Konten mit ihren Rollen.\n- **Einladen:** Neues Konto anlegen (Name, E-Mail) — das Passwort setzt die Person selbst.\n- **Rollen:** Rollen zuweisen oder entziehen.\n- **Passwort zurücksetzen:** Wenn jemand ausgesperrt ist, kannst Du ein neues Passwort setzen.\n- **Löschen:** Konten entfernen; bedenke, dass damit auch der Zugriff auf deren Wikis entfällt.\n- System-Rollen (z. B. `ADMIN`) sind geschützt und können nicht gelöscht werden."},
{"title":"Opening a wiki","tags":"Anleitung","lang":"en","text":"EN: **Opening a wiki** · DE: [[Ein Wiki öffnen]] · [[Start]]\n\n# Opening a wiki\n\n- On the home page, click the preview image or the name of a wiki.\n- You only see wikis you have read access to (see [[Roles and permissions]]).\n- A wiki without a preview image is rendered on first open — that may take a few seconds."},
{"title":"Overview","tags":"Anleitung","lang":"en","text":"EN: **Overview** · DE: [[Übersicht]] · [[Start]]\n\n# Overview\n\n**Signing in & account**\n- [[Signing in and out]]\n- [[Setting or changing your password]]\n- [[Your profile]]\n\n**Using wikis**\n- [[Opening a wiki]]\n- [[Editing and saving]]\n- [[Autosave]]\n\n**Managing your own wikis**\n- [[Creating a new wiki]]\n- [[Renaming a wiki]]\n- [[Deleting a wiki]]\n- [[Preview image]]\n\n**Collaboration**\n- [[Roles and permissions]]\n- [[Inviting someone]]\n- [[Sharing a wiki with a class]]\n- [[Pinboard]]\n\n**Teacher area**\n- [[Enabling students]]\n- [[Wiki limits for students]]\n\n**Administration**\n- [[Managing users]]\n- [[Templates]]\n- [[Bags and roles]]\n- [[Backup]]\n- [[Storage and files]]\n\n**My files**\n- [[Uploading a file]]\n- [[Using a file in a wiki]]"},
{"title":"Passwort setzen oder ändern","tags":"Anleitung","lang":"de","text":"DE: **Passwort setzen oder ändern** · EN: [[Setting or changing your password]] · [[Start]]\n\n# Passwort setzen oder ändern\n\n- Nach der Einladung hat der Nutzer noch kein Passwort — er setzt es beim ersten Anmelden selbst.\n- Passwort ändern: Menü oben rechts → **Profil** → **Passwort ändern**.\n- Nutze die Zufallsfunktion neben dem Feld, um ein sicheres Passwort zu erzeugen.\n- Der Admin kann ein Passwort jederzeit zurücksetzen (siehe [[Nutzer verwalten]])."},
{"title":"Pinboard","tags":"Anleitung","lang":"en","text":"EN: **Pinboard** · DE: [[Pinnwand]] · [[Start]]\n\n# Pinboard\n\n- The pinboard is a shared area for **pinning messages**.\n- Everyone sharing one of the pinboard's roles sees all notes and can add their own.\n- Unread notes are shown to you as a number in the navigation.\n- Admins and teachers can enable the pinboard for their roles."},
{"title":"Pinnwand","tags":"Anleitung","lang":"de","text":"DE: **Pinnwand** · EN: [[Pinboard]] · [[Start]]\n\n# Pinnwand\n\n- Die Pinnwand ist ein gemeinsamer Bereich zum **Anpinnen von Nachrichten**.\n- Jede Person, die eine der Rollen der Pinnwand teilt, sieht alle Zettel und kann eigene hinzufügen.\n- Ungelesene Zettel werden Dir in der Navigation mit einer Zahl angezeigt.\n- Admin und Lehrer können die Pinnwand für ihre Rollen freigeben."},
{"title":"Preview image","tags":"Anleitung","lang":"en","text":"EN: **Preview image** · DE: [[Vorschau-Bild]] · [[Start]]\n\n# Preview image\n\n- In the wiki list every wiki shows a **preview image** (a screenshot of its start page).\n- The image is created **lazily**: only when needed, and re-rendered at most once a day (unless something changes).\n- After an edit it is not redrawn immediately — it shows the state after the latest editing pause.\n- If the preview is missing (e.g. right after creation), it appears within a few seconds of opening the wiki."},
{"title":"Profil","tags":"Anleitung","lang":"de","text":"DE: **Profil** · EN: [[Your profile]] · [[Start]]\n\n# Profil\n\n- Unter **Profil** siehst Du Deine Daten: Benutzername, E-Mail und Deine Rollen.\n- Hier änderst Du Dein Passwort.\n- Die E-Mail-Adresse ist optional; sie wird als Wiederherstellungsansatz genutzt."},
{"title":"Rechte und Rollen","tags":"Anleitung","lang":"de","text":"DE: **Rechte und Rollen** · EN: [[Roles and permissions]] · [[Start]]\n\n# Rechte und Rollen\n\nJede Person hat **Rollen**, jede Rolle Rechte an Wikis:\n\n- **Lesen** — das Wiki öffnen und ansehen.\n- **Schreiben** — Inhalte ändern und Dateien hochladen.\n- **Verwalten** — z. B. andere einladen, umbenennen, löschen.\n\nDer Wiki-Besitzer entscheidet, wer sein Wiki sehen und bearbeiten darf (siehe [[Jemanden einladen]]). Liegt ein Wiki in einer Vorlage, gelten deren voreingestellte Rechte."},
{"title":"Renaming a wiki","tags":"Anleitung","lang":"en","text":"EN: **Renaming a wiki** · DE: [[Wiki umbenennen]] · [[Start]]\n\n# Renaming a wiki\n\n- As the owner (or an admin), open the wiki list and click **Edit** next to the wiki.\n- Change the **display name** — that is what the class sees in the list.\n- The slug stays stable for links; only change it if you want to update the old links.\n- After renaming, the preview image is re-rendered on the next open."},
{"title":"Roles and permissions","tags":"Anleitung","lang":"en","text":"EN: **Roles and permissions** · DE: [[Rechte und Rollen]] · [[Start]]\n\n# Roles and permissions\n\nEvery person has **roles**, and every role has rights on wikis:\n\n- **Read** — open and view the wiki.\n- **Write** — change content and upload files.\n- **Manage** — e.g. invite others, rename, delete.\n\nThe wiki owner decides who may see and edit the wiki (see [[Inviting someone]]). Wikis created from a [[template|Templates]] inherit its default rights.","updated":"2026-09-23T19:50:31.000Z","revision":1},
{"title":"Schüler freischalten","tags":"Anleitung","lang":"de","text":"DE: **Schüler freischalten** · EN: [[Enabling students]] · [[Start]]\n\n# Schüler freischalten\n\n- Im Users-Tab legst Du die Schüler-Konten an (Einladung) und weist ihnen eine Klassen-Rolle zu.\n- Mit dieser Rolle kann kein Schüler in fremde Wikis schauen — er sieht nur, was ihm explizit freigegeben wurde ([[Wiki mit einer Klasse teilen]]).\n- Lege danach fest, **wie viele eigene Wikis** ein Schüler anlegen darf ([[Wiki-Limit für Schüler]])."},
{"title":"Setting or changing your password","tags":"Anleitung","lang":"en","text":"EN: **Setting or changing your password** · DE: [[Passwort setzen oder ändern]] · [[Start]]\n\n# Setting or changing your password\n\n- After an invitation you have no password yet — you set it yourself when signing in for the first time.\n- To change it: menu top right → **Profile** → **Change password**.\n- Use the random-generator button next to the field to create a strong password.\n- An admin can reset your password at any time (see [[Managing users]])."},
{"title":"Sharing a wiki with a class","tags":"Anleitung","lang":"en","text":"EN: **Sharing a wiki with a class** · DE: [[Wiki mit einer Klasse teilen]] · [[Start]]\n\n# Sharing a wiki with a class\n\n- The admin creates a class role (e.g. `Class 1`) and assigns it to the student accounts.\n- In the wiki dialog, add the class role under **\"Who may read this wiki\"**.\n- All students of that class can then open and read the wiki.\n- Only people you add under **\"Who may write this wiki\"** may also change content."},
{"title":"Sicherung","tags":"Anleitung","lang":"de","text":"DE: **Sicherung (Backup)** · EN: [[Backup]] · [[Start]]\n\n# Sicherung (Backup)\n\n- Der MultiWiki-Server bietet ein **Admin-Backup**: Eine einzige Datei mit Datenbank, Schlüsseln und Konfiguration.\n- Im **Backup-Bereich** startest Du den Download.\n- Bewahre Backups an einem sicheren Ort auf (Betriebsgeheimnisse sind darin enthalten).\n- Erstelle regelmäßig ein Backup, bevor Du größere Umbauten machst."},
{"title":"Signing in and out","tags":"Anleitung","lang":"en","text":"EN: **Signing in and out** · DE: [[Anmelden und abmelden]] · [[Start]]\n\n# Signing in and out\n\n- Open the MultiWiki server home page.\n- Enter your username and password and click **Sign in**.\n- To sign out, open the menu in the top right and choose **Sign out**.\n- No account yet? Ask a teacher or an admin to invite you (see [[Managing users]])."},
{"title":"Speicher und Dateien","tags":"Anleitung","lang":"de","text":"DE: **Speicher und Dateien** · EN: [[Storage and files]] · [[Start]]\n\n# Speicher und Dateien\n\n- Der **Speicher-Tab** zeigt die Auslastung: Wikis, Dateien und die größten Speicherverbraucher.\n- Die Sektion **„Blobs & Dateien\"** listet hochgeladene Dateien samt Herkunft.\n- Ungültige Reste (abgebrochene Uploads, verwaiste Dateien) kannst Du nach Vorschau der Liste bereinigen.\n- Mit **„Speicherverbrauch pro User (Top 10)\"** siehst Du, wer am meisten Platz belegt."},
{"title":"Start","tags":"Anleitung","text":"# MWS Bedienungsanleitung\n\nWillkommen! Dies ist die Bedienungsanleitung für den MultiWiki-Server.\n\n**Sprache wählen / Choose your language:**\n\n- [[Deutsch|Übersicht]] » Übersicht auf Deutsch\n- [[English|Overview]] » English overview\n\nDie Anleitung ist kurz gehalten: jede Seite erklärt genau ein Thema. Über die Suche oder die Seitenleiste findest Du schnell, was Du suchst.","updated":"2026-09-23T19:50:31.000Z","revision":1},
{"title":"Storage and files","tags":"Anleitung","lang":"en","text":"EN: **Storage and files** · DE: [[Speicher und Dateien]] · [[Start]]\n\n# Storage and files\n\n- The **Storage tab** shows usage: wikis, files and the biggest storage consumers.\n- The **\"Blobs & files\"** section lists uploaded files and where they come from.\n- Invalid leftovers (aborted uploads, orphaned files) can be cleaned up after previewing the list.\n- **\"Storage usage per user (top 10)\"** shows who uses the most space."},
{"title":"Templates","tags":"Anleitung","lang":"en","text":"EN: **Templates** · DE: [[Vorlagen]] · [[Start]]\n\n# Templates\n\n- **Templates** bundle starter bags, write rights and plugins — so wikis share the same base structure.\n- In the **Templates tab** you can create and edit templates.\n- When creating a wiki you choose a template (see [[Creating a new wiki]]).\n- Changing a template applies to newly created wikis, not automatically to existing ones."},
{"title":"Uploading a file","tags":"Anleitung","lang":"en","text":"EN: **Uploading a file** · DE: [[Datei hochladen]] · [[Start]]\n\n# Uploading a file\n\n- Under **My files** you can upload files into your personal area.\n- There you see the number of your files and can delete old ones.\n- The files are then available for embedding in a wiki ([[Using a file in a wiki]])."},
{"title":"Using a file in a wiki","tags":"Anleitung","lang":"en","text":"EN: **Using a file in a wiki** · DE: [[Datei in einem Wiki verwenden]] · [[Start]]\n\n# Using a file in a wiki\n\n- **Upload in the wiki:** while editing a wiki you can upload the file directly there — it is stored with the wiki owner.\n- **Wiki owners (teacher/admin):** files uploaded to your own wikis are permanently available to that wiki.\n- Images are shown as images, other files as download links.\n- Guests with read access see the content but cannot add files."},
{"title":"Vorlagen","tags":"Anleitung","lang":"de","text":"DE: **Vorlagen** · EN: [[Templates]] · [[Start]]\n\n# Vorlagen\n\n- **Templates** (Vorlagen) bündeln Start-Bags, Schreib-Rechte und Plugins — so entstehen Wikis mit gleichem Grundaufbau.\n- Im **Templates-Tab** kannst Du Vorlagen anlegen und bearbeiten.\n- Beim Anlegen eines Wikis wählst Du die Vorlage (siehe [[Ein neues Wiki anlegen]]).\n- Änderungen an der Vorlage gelten für neu angelegte Wikis, nicht automatisch für bestehende."},
{"title":"Vorschau-Bild","tags":"Anleitung","lang":"de","text":"DE: **Vorschau-Bild** · EN: [[Preview image]] · [[Start]]\n\n# Vorschau-Bild\n\n- In der Wiki-Liste zeigt jedes Wiki ein **Vorschaubild** (Screenshot der Startseite).\n- Das Bild wird **lazy** erzeugt: nur bei Bedarf und höchstens einmal pro Tag neu gerendert (sofern sich nichts ändert).\n- Nach einer Bearbeitung wird es nicht sofort neu gezeichnet — es zeigt den Stand nach der letzten Bearbeitungspause.\n- Fehlt das Vorschau-Bild (z. B. direkt nach dem Anlegen), erscheint es nach dem ersten Öffnen des Wikis innerhalb weniger Sekunden."},
{"title":"Wiki limits for students","tags":"Anleitung","lang":"en","text":"EN: **Wiki limits for students** · DE: [[Wiki-Limit für Schüler]] · [[Start]]\n\n# Wiki limits for students\n\n- In the Users tab you can set a **wiki limit** per student (0 = none, or a fixed number).\n- An empty value means: no limit.\n- When a student reaches the limit, a message tells them they cannot create more wikis."},
{"title":"Wiki löschen","tags":"Anleitung","lang":"de","text":"DE: **Wiki löschen** · EN: [[Deleting a wiki]] · [[Start]]\n\n# Wiki löschen\n\n- Nur der **Besitzer** des Wikis oder der **Admin** kann es löschen.\n- Wiki-Liste → **Bearbeiten** → **Löschen** und bestätigen.\n- Beim Löschen verschwinden auch die Inhalte des Wikis und das Vorschau-Bild **sofort** — es gibt keine Wiederherstellung.\n- Übrig gebliebene Vorschau-Dateien gelöschter Wikis werden beim Serverstart automatisch aufgeräumt."},
{"title":"Wiki mit einer Klasse teilen","tags":"Anleitung","lang":"de","text":"DE: **Wiki mit einer Klasse teilen** · EN: [[Sharing a wiki with a class]] · [[Start]]\n\n# Wiki mit einer Klasse teilen\n\n- Der Admin legt eine Klassen-Rolle an (z. B. `Klasse 1`) und weist sie den Schüler-Konten zu.\n- Du trägst im Wikis-Dialog bei **„Wer darf das Wiki lesen\"** die Klassen-Rolle ein.\n- Dann können alle Schüler dieser Klasse das Wiki öffnen und mitlesen.\n- Nur die Personen, die Du bei **„Wer darf das Wiki schreiben\"** einträgst, dürfen auch ändern."},
{"title":"Wiki umbenennen","tags":"Anleitung","lang":"de","text":"DE: **Wiki umbenennen** · EN: [[Renaming a wiki]] · [[Start]]\n\n# Wiki umbenennen\n\n- Als Besitzer (oder Admin) öffnest Du die Wiki-Liste und klickst **Bearbeiten** neben dem Wiki.\n- Ändere den **Anzeigenamen** — so sieht die Klasse das Wiki in der Liste.\n- Der Slug (Kurzname) bleibt aus Links stabil; ändere ihn nur, wenn Du die alten Links aktualisieren möchtest.\n- Nach dem Umbenennen erscheint das Vorschau-Bild beim nächsten Öffnen neu gerendert."},
{"title":"Wiki-Limit für Schüler","tags":"Anleitung","lang":"de","text":"DE: **Wiki-Limit für Schüler** · EN: [[Wiki limits for students]] · [[Start]]\n\n# Wiki-Limit für Schüler\n\n- Im Users-Tab stellst Du pro Schüler eine **Wiki-Grenze** ein (0 = gar nicht, oder eine feste Anzahl).\n- Ein leerer Wert bedeutet: kein Limit.\n- Überschreitet der Schüler die Grenze, erscheint die Meldung, dass er nicht mehr anlegen darf."},
{"title":"Your profile","tags":"Anleitung","lang":"en","text":"EN: **Your profile** · DE: [[Profil]] · [[Start]]\n\n# Your profile\n\n- **Profile** shows your account data: username, email and your roles.\n- Change your password here.\n- The email address is optional; it is used as a recovery option."},
{"title":"Übersicht","tags":"Anleitung","lang":"de","text":"DE: **Übersicht** · EN: [[Overview]] · [[Start]]\n\n# Inhaltsübersicht\n\n**Anmelden & Konto**\n- [[Anmelden und abmelden]]\n- [[Passwort setzen oder ändern]]\n- [[Profil]]\n\n**Wikis nutzen**\n- [[Ein Wiki öffnen]]\n- [[Bearbeiten und speichern]]\n- [[Autospeicherung]]\n\n**Eigene Wikis verwalten**\n- [[Ein neues Wiki anlegen]]\n- [[Wiki umbenennen]]\n- [[Wiki löschen]]\n- [[Vorschau-Bild]]\n\n**Zusammenarbeiten**\n- [[Rechte und Rollen]]\n- [[Jemanden einladen]]\n- [[Wiki mit einer Klasse teilen]]\n- [[Pinnwand]]\n\n**Lehrer-Bereich**\n- [[Schüler freischalten]]\n- [[Wiki-Limit für Schüler]]\n\n**Admin-Bereich**\n- [[Nutzer verwalten]]\n- [[Vorlagen]]\n- [[Bags und Rollen]]\n- [[Sicherung (Backup)|Sicherung]]\n- [[Speicher und Dateien]]\n\n**Meine Dateien**\n- [[Datei hochladen]]\n- [[Datei in einem Wiki verwenden]]"},

var globalCheck =[
	"  Object.defineProperty(Object.prototype, '__temp__', {",
	"    get: function () { return this; },",
	"    configurable: true",
	"  });",
	"  if(Object.keys(__temp__).length){",
	"    console.log(\"Warning: Global assignment detected\",Object.keys(__temp__));",
	"    delete Object.prototype.__temp__;",
	"  }",
	"  delete Object.prototype.__temp__;",
].join("\n");

/*
Run code globally with specified context variables in scope
*/
$tw.utils.evalGlobal = function(code,context,filename,sandbox,allowGlobals) {
	var contextCopy = $tw.utils.extend(Object.create(null),context);
	// Get the context variables as a pair of arrays of names and values
	var contextNames = [], contextValues = [];
	$tw.utils.each(contextCopy,function(value,name) {
		contextNames.push(name);
		contextValues.push(value);
	});
	// Add the code prologue and epilogue
	code = [
		"(function(" + contextNames.join(",") + ") {",
		"  (function(){" + code + "\n;})();\n",
		(!$tw.browser && sandbox && !allowGlobals) ? globalCheck : "",
		"\nreturn exports;\n",
		"})"
	].join("");

	// Compile the code into a function
	var fn;
	if($tw.browser) {
		fn = Function("return " + code + "\n\n//# sourceURL=" + filename)(); // See https://github.com/TiddlyWiki/TiddlyWiki5/issues/6839
	} else {
		if(sandbox){
			fn = vm.runInContext(code,sandbox,filename);
		} else {
			fn = vm.runInThisContext(code,filename);
		}
	}
	// Call the function and return the exports
	return fn.apply(null,contextValues);
};
$tw.utils.sandbox = !$tw.browser ? vm.createContext({}) : undefined;
/*
Run code in a sandbox with only the specified context variables in scope
*/
$tw.utils.evalSandboxed = $tw.browser ? $tw.utils.evalGlobal : function(code,context,filename,allowGlobals) {
	return $tw.utils.evalGlobal(
		code,context,filename,
		allowGlobals ? vm.createContext({}) : $tw.utils.sandbox,
		allowGlobals
	);
};

/*

/*
Hides or shows the wrapper depending on whether there are any outstanding prompts
