<!DOCTYPE html>
<html class="mdui-theme-auto">

<head>
  <script>window.embeddedServerPreflight = `$$js:embeddedServerPreflight:stringify$$`;</script>
  <script>
    try {
      var preflight = window.embeddedServerPreflight;
      if (preflight && (preflight.theme === "dark" || preflight.theme === "light")) {
        document.documentElement.setAttribute("data-theme", preflight.theme);
        document.documentElement.style.setProperty("background-color", preflight.theme === "dark" ? "#121212" : "#eeeeee");
      }
    } catch (e) { }
  </script>
  <style>
    @media (prefers-color-scheme: dark) {
      html:not(.loaded) {
        background-color: #121212;
      }
    }

    @media (prefers-color-scheme: light) {
      html:not(.loaded) {
        background-color: #eeeeee;
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
      border: 0;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      background-color: rgb(var(--mdui-color-surface-container));
    }

    @font-face {
      font-family: "Roboto";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("$$js:pathPrefix$$/fonts/roboto-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: "Roboto";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("$$js:pathPrefix$$/fonts/roboto-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    @font-face {
      font-family: "Roboto";
      font-style: italic;
      font-weight: 100 900;
      font-display: swap;
      src: url("$$js:pathPrefix$$/fonts/roboto-latin-italic.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: "Roboto";
      font-style: italic;
      font-weight: 100 900;
      font-display: swap;
      src: url("$$js:pathPrefix$$/fonts/roboto-latin-ext-italic.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    body {
      font-family: "Roboto", sans-serif;
      font-optical-sizing: auto;
      font-variation-settings:
        "wdth" 100;
    }

  </style>
  <base href="$$js:pathPrefix$$/">
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
  <meta name="viewport" content="initial-scale=1, width=device-width" />
  <title></title>
  <link rel="apple-touch-icon" sizes="180x180" href="$$js:pathPrefix$$/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="$$js:pathPrefix$$/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="$$js:pathPrefix$$/favicon-16x16.png">
  <link rel="stylesheet" href="$$js:pathPrefix$$/normalize.css">
  <link rel="manifest" href="$$js:pathPrefix$$/site.webmanifest">
  <!-- CSS entry files -->
  <script>window.pathPrefix = `$$js:pathPrefix:stringify$$`;</script>
  <script>window.embeddedServerResponse = `$$js:embeddedServerResponse:stringify$$`;</script>
  <!-- JS entry files -->
</head>

</html>
