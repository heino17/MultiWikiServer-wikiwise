name: Build and typecheck

# Verification for this fork: install, typecheck server packages and admin app,
# then build the runtime bundle.
#
# This workflow deliberately deploys nothing and uses no secrets. The workflow
# it replaces was inherited from upstream: it built editions/mws-docs and pushed
# the result to TiddlyWiki/mws.tiddlywiki.com-gh-pages, a site that belongs to
# TiddlyWiki and that this fork must never overwrite.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck server packages
        run: npm run tsc2
      - name: Typecheck admin app
        run: npm run tsc
        working-directory: packages/admin-vanilla
      - name: Build runtime and client bundle
        run: npm run build